<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Not found — YUNO / MUSIC &amp; WORKS</title>
  <style>
    :root{color:#1A1A1A;background:#F7F7F4;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif}*{box-sizing:border-box}body{margin:0;line-height:1.7}.page{max-width:680px;margin:0 auto;padding:12vh 1.5rem}.eyebrow{color:#0c5f63;font-size:.8rem;font-weight:700;letter-spacing:.1em}h1{font:clamp(2.3rem,8vw,4.5rem)/1.1 Georgia,'Times New Roman','Hiragino Mincho ProN','Yu Mincho',serif;margin:.6rem 0 1rem}p{max-width:38rem;color:#686868}a,button{color:#0c5f63}button{font:inherit;border:0;background:transparent;padding:.4rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}a:focus-visible,button:focus-visible{outline:3px solid #0c5f63;outline-offset:3px}.language{position:absolute;top:1rem;right:1rem;display:flex;gap:.25rem}.language button[aria-pressed=true]{font-weight:700;color:#1A1A1A}
  </style>
</head>
<body>
  <div class="language" aria-label="Language"><button type="button" data-lang="ja" aria-pressed="true">日本語</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
  <main class="page">
    <div class="eyebrow">404</div>
    <h1 id="title">ページが見つかりません。</h1>
    <p id="message">リンクが古いか、ページが移動した可能性があります。</p>
    <p><a id="home-link" href="/">ホームへ戻る</a></p>
  </main>
  <script>
    (() => {
      const strings = { ja: { title: 'ページが見つかりません。', message: 'リンクが古いか、ページが移動した可能性があります。', home: 'ホームへ戻る' }, en: { title: 'Page not found.', message: 'The link may be old, or the page may have moved.', home: 'Return home' } };
      const firstSegment = location.pathname.split('/').filter(Boolean)[0];
      const siteBase = /\.github\.io$/i.test(location.hostname) && firstSegment && firstSegment !== '404.html' ? `/${firstSegment}/` : '/';
      const home = document.getElementById('home-link');
      home.href = siteBase;
      const render = lang => { document.documentElement.lang = lang; document.getElementById('title').textContent = strings[lang].title; document.getElementById('message').textContent = strings[lang].message; home.textContent = strings[lang].home; document.querySelectorAll('[data-lang]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.lang === lang))); };
      document.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => render(button.dataset.lang)));
      render('ja');
    })();
  </script>
</body>
</html>
