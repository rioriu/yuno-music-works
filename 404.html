<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-lcAM9mpY7dCnpi9UZ2XPnVWFabZeZ7fCWaLna8XOuoY='; style-src 'self' 'sha256-WEgh/1LeHk6RuhyrbXjs13j9FrZFoATLZ6f0KC3y/CA='; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://embed.nicovideo.jp https://w.soundcloud.com; form-action https://formspree.io; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>Not found — YUNO / MUSIC &amp; WORKS</title>
  <style>:root{color:#1a1a1a;background:#f7f7f4;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif}*{box-sizing:border-box}body{margin:0;line-height:1.7}.page{max-width:680px;margin:0 auto;padding:12vh 1.5rem}.eyebrow{color:#0c5f63;font-size:.8rem;font-weight:700;letter-spacing:.1em}h1{font:clamp(2.3rem,8vw,4.5rem)/1.1 Georgia,'Times New Roman','Hiragino Mincho ProN','Yu Mincho',serif;margin:.6rem 0 1rem}p{max-width:38rem;color:#686868}a,button{color:#0c5f63}button{font:inherit;border:0;background:transparent;padding:.4rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}a:focus-visible,button:focus-visible{outline:3px solid #0c5f63;outline-offset:3px}.language{position:absolute;top:1rem;right:1rem;display:flex;gap:.25rem}.language button[aria-pressed=true]{font-weight:700;color:#1a1a1a}</style>
</head>
<body>
  <div class="language" aria-label="Language"><button type="button" data-lang="ja" aria-pressed="true">日本語</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
  <main class="page">
    <div class="eyebrow">404</div>
    <h1 id="title">ページが見つかりません。</h1>
    <p id="message">リンクが古いか、ページが移動した可能性があります。</p>
    <p><a id="home-link" href="/">ホームに戻る</a></p>
  </main>
  <script>const strings = {
  ja: {
    title:'\u30da\u30fc\u30b8\u304c\u898b\u3064\u304b\u308a\u307e\u305b\u3093\u3002',
    message:'\u30ea\u30f3\u30af\u304c\u53e4\u3044\u304b\u3001\u30da\u30fc\u30b8\u304c\u79fb\u52d5\u3057\u305f\u53ef\u80fd\u6027\u304c\u3042\u308a\u307e\u3059\u3002',
    home:'\u30db\u30fc\u30e0\u306b\u623b\u308b',
  },
  en: {title:'Page not found.',message:'The link may be old, or the page may have moved.',home:'Return home'},
};
const firstSegment = location.pathname.split('/').filter(Boolean)[0];
const siteBase = /\.github\.io$/i.test(location.hostname) && firstSegment && firstSegment !== '404.html' ? `/${firstSegment}/` : '/';
const home = document.getElementById('home-link');
home.href = siteBase;
const render = lang => {
  document.documentElement.lang = lang;
  document.getElementById('title').textContent = strings[lang].title;
  document.getElementById('message').textContent = strings[lang].message;
  home.textContent = strings[lang].home;
  document.querySelectorAll('[data-lang]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.lang === lang)));
};
document.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => render(button.dataset.lang)));
render('ja');</script>
</body>
</html>
