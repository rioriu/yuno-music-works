<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://embed.nicovideo.jp https://w.soundcloud.com; form-action https://formspree.io; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="YUNOによる編曲作品を、アーティスト・作曲家、原曲ジャンル、編成から探せます。">
  <title>Arrangements — YUNO</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script type="module" src="../assets/js/app.js"></script>
</head>
<body data-page="arrangements" data-page-meta="arrangements" data-catalog="arrangement">
  <header class="site-header" data-site-header></header>
  <main class="shell" id="main">
    <header class="page-heading">
      <div class="eyebrow" data-ja="編曲作品" data-en="Arrangements">編曲作品</div>
      <h1 data-ja="編曲作品" data-en="Arrangements">編曲作品</h1>
      <p data-ja="アーティスト・作曲家、原曲ジャンル、編成から編曲作品を探せます。" data-en="Browse arrangements by artist or composer, source genre, and ensemble.">アーティスト・作曲家、原曲ジャンル、編成から編曲作品を探せます。</p>
    </header>

    <section class="creator-browser" aria-labelledby="creator-browser-title">
      <h2 id="creator-browser-title" data-ja="アーティスト・作曲家から探す" data-en="Browse by artist/composer">アーティスト・作曲家から探す</h2>
      <div class="creator-grid" data-arrangement-creators></div>
    </section>

    <form class="controls arrangement-controls" aria-label="Arrangement filters">
      <label class="control"><span data-ja="原曲ジャンル" data-en="Source genre">原曲ジャンル</span><select name="genre">
        <option value="" data-ja="すべて" data-en="All">すべて</option>
        <option value="pops" data-ja="POPS" data-en="POPS">POPS</option>
        <option value="screen" data-ja="映画・ドラマ音楽" data-en="Film &amp; TV Music">映画・ドラマ音楽</option>
      </select></label>
      <label class="control"><span data-ja="編成" data-en="Ensemble">編成</span><select name="ensemble">
        <option value="" data-ja="すべて" data-en="All">すべて</option>
        <option value="solo" data-ja="ピアノソロ" data-en="Piano Solo">ピアノソロ</option>
        <option value="duo" data-ja="ピアノ連弾" data-en="Piano Four Hands">ピアノ連弾</option>
        <option value="ensemble" data-ja="室内楽" data-en="Chamber Ensemble">室内楽</option>
      </select></label>
      <label class="control"><span data-ja="並び順" data-en="Sort">並び順</span><select name="sort">
        <option value="newest" data-ja="公開日：新しい順" data-en="Published date: newest first">公開日：新しい順</option>
        <option value="oldest" data-ja="公開日：古い順" data-en="Published date: oldest first">公開日：古い順</option>
        <option value="title" data-ja="曲名順" data-en="Title">曲名順</option>
      </select></label>
    </form>

    <p class="results-count" data-arrangement-count></p>
    <p class="filter-status" data-arrangement-status aria-live="polite"></p>
    <div class="work-list arrangement-list" data-work-list></div>
  </main>
  <footer class="site-footer" data-site-footer></footer>
</body>
</html>
