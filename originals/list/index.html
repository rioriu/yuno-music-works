<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://embed.nicovideo.jp; form-action https://formspree.io; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="YUNOのオリジナル作品一覧。編成で絞り込めます。">
  <title>オリジナル作品一覧 — YUNO</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <script type="module" src="../../assets/js/app.js"></script>
</head>
<body data-page="originals" data-catalog="original">
  <header class="site-header" data-site-header></header>
  <main class="shell" id="main">
    <header class="page-heading catalog-heading">
      <div class="eyebrow">Original Works / <span data-filter-summary>すべて</span></div>
      <h1 data-ja="オリジナル作品一覧" data-en="Original Works">オリジナル作品一覧</h1>
      <p><a href="../" data-ja="編成の目次へ戻る" data-en="Back to instrumentation index">編成の目次へ戻る</a></p>
    </header>
    <form class="controls" aria-label="Work filters">
      <label class="control"><span data-ja="編成" data-en="Instrumentation">編成</span><select name="ensemble">
        <option value="" data-ja="すべて" data-en="All">すべて</option>
        <option value="piano">Piano / ピアノ</option><option value="solo">Solo / 独奏</option><option value="solo-piano">Solo &amp; Piano / 独奏＋ピアノ</option>
        <option value="strings">String Ensemble / 弦楽</option><option value="woodwinds">Woodwind Ensemble / 木管</option><option value="brass">Brass Ensemble / 金管</option>
        <option value="percussion">Percussion Ensemble / 打楽器</option><option value="mixed">Mixed Ensemble / 混成</option><option value="orchestra">Orchestra / オーケストラ</option>
        <option value="wind">Wind Ensemble / 吹奏楽</option><option value="art-song">Art Song / 歌曲</option><option value="choral">Choral Works / 合唱</option><option value="pops">POPS</option>
      </select></label>
      <label class="control"><span data-ja="並び順" data-en="Sort">並び順</span><select name="sort"><option value="newest" data-ja="新しい順" data-en="Newest first">新しい順</option><option value="oldest" data-ja="古い順" data-en="Oldest first">古い順</option><option value="title" data-ja="曲名順" data-en="By title">曲名順</option></select></label>
    </form>
    <div class="work-list" data-work-list></div>
  </main>
  <footer class="site-footer" data-site-footer></footer>
</body>
</html>
