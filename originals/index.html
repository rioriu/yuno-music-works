<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://embed.nicovideo.jp https://w.soundcloud.com; form-action https://formspree.io; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="YUNOのオリジナル作品を、編成・ジャンル、曲の長さ、楽器から探せます。">
  <title>オリジナル作品 — YUNO</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../assets/css/styles.css?v=20260825-3">
  <script type="module" src="../assets/js/app.js"></script>
</head>
<body data-page="originals" data-page-meta="originals" data-catalog="original-discovery">
  <header class="site-header" data-site-header></header>
  <main class="shell" id="main">
    <header class="page-heading">
      <div class="eyebrow" data-ja="ORIGINAL WORKS" data-en="ORIGINAL WORKS">ORIGINAL WORKS</div>
      <h1 data-ja="オリジナル作品" data-en="Original Works">オリジナル作品</h1>
    </header>

    <div class="arrangement-discovery original-discovery" data-original-discovery>
      <section class="arrangement-discovery-group" aria-labelledby="original-group-browser-title">
        <h2 id="original-group-browser-title" data-ja="編成・ジャンルから探す" data-en="Browse by ensemble or genre">編成・ジャンルから探す</h2>
        <div class="arrangement-discovery-links" data-original-group-links></div>
      </section>

      <section class="arrangement-discovery-group" aria-labelledby="original-duration-browser-title">
        <h2 id="original-duration-browser-title" data-ja="曲の長さから探す" data-en="Browse by duration">曲の長さから探す</h2>
        <div class="arrangement-discovery-links" data-original-duration-links></div>
      </section>

      <section class="arrangement-discovery-group" aria-labelledby="original-instrument-browser-title">
        <h2 id="original-instrument-browser-title" data-ja="楽器から探す" data-en="Browse by instrument">楽器から探す</h2>
        <div class="arrangement-discovery-links" data-original-instrument-links></div>
      </section>

      <p class="arrangement-all-link" data-original-all-link></p>
    </div>

    <section class="arrangement-results original-results" data-original-results hidden aria-labelledby="original-results-title">
      <a class="arrangement-back" href="./" data-ja="探し方を選び直す" data-en="Choose another way to browse">探し方を選び直す</a>
      <header class="arrangement-results-heading">
        <h2 id="original-results-title" data-original-results-title></h2>
        <p class="results-count" data-original-count></p>
        <p class="filter-status visually-hidden" data-original-status aria-live="polite"></p>
      </header>
      <div class="work-list arrangement-list original-list" data-work-list></div>
    </section>
  </main>
  <footer class="site-footer" data-site-footer></footer>
</body>
</html>
